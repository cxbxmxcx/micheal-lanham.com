<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E09B4A"/>
      <stop offset="45%" stop-color="#C2703C"/>
      <stop offset="100%" stop-color="#C2703C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E09B4A"/>
      <stop offset="100%" stop-color="#C2703C"/>
