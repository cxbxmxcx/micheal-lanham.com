  </defs>
  <!-- dendrite filaments -->
  <path d="M32 32 C24 24 18 20 10 14" stroke="url(#fil)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M32 32 C42 26 48 24 56 16" stroke="url(#fil)" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 32 C34 42 32 48 36 56" stroke="url(#fil)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- tiny teal satellite dot on one filament -->
