# Build the Vite site and publish dist/ to GitHub Pages on every push to main.
# Pages must be set to "GitHub Actions" as its source (done via the API on
# first setup). The Unity demos, CNAME and 404.html ship from public/.
# The build and every check run in check.yml; only the deploy job may write
# to Pages.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Let a deployment that has started finish; a newer push waits its turn.
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/check.yml
    with:
      upload-pages: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
